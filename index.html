<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notas &amp; Compases · Clases de música</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-note">♪</span>
    <div class="brand-text">
      <h1>Notas &amp; Compases</h1>
      <span class="brand-sub">Curso <span id="cursoLabel"></span></span>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="calendario">Calendario</button>
    <button class="tab" data-view="semana">Semana</button>
    <button class="tab" data-view="3anos">3 años</button>
    <button class="tab" data-view="4y5anos">4–5 años</button>
    <button class="tab" data-view="flauta">Flauta</button>
  </nav>
</header>

<main id="app"></main>

<nav class="bottomnav" id="bottomnav">
  <button class="bnitem active" data-view="calendario"><span class="bnicon">📅</span>Mes</button>
  <button class="bnitem" data-view="semana"><span class="bnicon">🗓️</span>Semana</button>
  <button class="bnitem" data-view="3anos"><span class="bnicon">🔵</span>3a</button>
  <button class="bnitem" data-view="4y5anos"><span class="bnicon">🟢</span>4-5a</button>
  <button class="bnitem" data-view="flauta"><span class="bnicon">🟡</span>Flauta</button>
</nav>

<div id="modalRoot"></div>

<script src="app.js"></script>
</body>
</html>
