<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emmva</title>
<link rel="icon" type="image/jpg" href="favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="icon.png" alt="Icono" class="brand-note">
    <div class="brand-text">
      <h1>Emmva</h1>
      <span class="brand-sub">Curso <span id="cursoLabel"></span></span>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="calendario">Calendario</button>
    <button class="tab" data-view="semana">Semana</button>
    <button class="tab" data-view="3anos">3 años</button>
    <button class="tab" data-view="4y5anos">4–5 años</button>
    <button class="tab" data-view="flauta">Flauta</button>
  </nav>
</header>

<main id="app"></main>
